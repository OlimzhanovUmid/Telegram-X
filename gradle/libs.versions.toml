androidx-annotation = "1.10.0"
androidx-biometric = "1.1.0"
androidx-palette = "1.0.0"
androidx-collection = "1.6.0"
androidx-interpolator = "1.0.0"

firebase-messaging = "25.1.0"
google-recaptcha = "18.9.1"
