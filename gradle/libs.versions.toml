ksp = "2.3.9"
desugaring = "2.1.5"

kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"

# minSdk is 26; the former legacy/lollipop/latest version splits were collapsed to a single version each.
androidx-core = "1.19.0"
androidx-activity = "1.13.0"
androidx-work = "2.11.2"
androidx-room = "2.8.4"
androidx-gridlayout = "1.1.0"
